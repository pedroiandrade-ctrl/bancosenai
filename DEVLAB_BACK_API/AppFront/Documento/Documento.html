<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Gestão de documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css" />
</head>

<body>
    <h1>Gestão de Documentos</h1>

    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do cliente" /><br />
        <input type="file" id="arquivo" />
        <button id="btnEnviar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <div class="busca-container">
        <input type="number" id="codigoClienteBusca" placeholder="Código do cliente para busca" />
        <button id="btnBuscar" onclick="listarDocumentos()">Buscar Documentos</button>
    </div>

    <table id="tabelaDocumentos">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Extensão</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
        </tbody>
    </table>

    <script src="documento.js"></script>
</body>
</html>
